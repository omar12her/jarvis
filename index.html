<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. AI</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --primary: #00d4ff;
            --secondary: #0066ff;
            --text: #e0e0ff;
            --glow: rgba(0, 212, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Courier New', monospace;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0.2;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 95%;
            max-width: 500px;
            text-align: center;
            padding: 15px;
        }

        .jarvis-core {
            width: min(180px, 45vw);
            height: min(180px, 45vw);
            margin: 0 auto 25px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                    rgba(0, 212, 255, 0.1) 0%,
                    rgba(0, 102, 255, 0.05) 40%,
                    transparent 70%);
            border: 3px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 40px var(--glow), inset 0 0 40px var(--glow);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .jarvis-core.listening {
            border-color: rgba(0, 255, 136, 0.8);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.5), inset 0 0 60px rgba(0, 255, 136, 0.3);
            animation: pulseGreen 1.5s ease-in-out infinite;
        }

        .jarvis-core.speaking {
            border-color: rgba(255, 170, 0, 0.8);
            box-shadow: 0 0 60px rgba(255, 170, 0, 0.5), inset 0 0 60px rgba(255, 170, 0, 0.3);
            animation: pulseOrange 0.8s ease-in-out infinite;
        }

        .jarvis-core.thinking {
            border-color: rgba(147, 51, 234, 0.8);
            box-shadow: 0 0 60px rgba(147, 51, 234, 0.5), inset 0 0 60px rgba(147, 51, 234, 0.3);
            animation: pulsePurple 1s ease-in-out infinite;
        }

        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.5), inset 0 0 40px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 80px rgba(0, 255, 136, 0.8), inset 0 0 80px rgba(0, 255, 136, 0.5); }
        }

        @keyframes pulseOrange {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 170, 0, 0.5), inset 0 0 40px rgba(255, 170, 0, 0.3); }
            50% { box-shadow: 0 0 80px rgba(255, 170, 0, 0.8), inset 0 0 80px rgba(255, 170, 0, 0.5); }
        }

        @keyframes pulsePurple {
            0%, 100% { box-shadow: 0 0 40px rgba(147, 51, 234, 0.5), inset 0 0 40px rgba(147, 51, 234, 0.3); }
            50% { box-shadow: 0 0 80px rgba(147, 51, 234, 0.8), inset 0 0 80px rgba(147, 51, 234, 0.5); }
        }

        .jarvis-core::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--primary);
            animation: spin 3s linear infinite;
        }

        .jarvis-core::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1px solid transparent;
            border-bottom-color: var(--secondary);
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .jarvis-icon {
            font-size: min(55px, 13vw);
            z-index: 1;
            filter: drop-shadow(0 0 20px var(--primary));
            transition: all 0.3s ease;
        }

        .listening .jarvis-icon { filter: drop-shadow(0 0 30px #00ff88); animation: flicker 0.3s infinite; }
        .speaking .jarvis-icon { filter: drop-shadow(0 0 30px #ffaa00); animation: flicker 0.2s infinite; }
        .thinking .jarvis-icon { filter: drop-shadow(0 0 30px #a855f7); animation: flicker 0.5s infinite; }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status {
            font-size: clamp(14px, 3.5vw, 18px);
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .status-active { color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.8); }
        .status-speaking { color: #ffaa00; text-shadow: 0 0 20px rgba(255, 170, 0, 0.8); }
        .status-thinking { color: #a855f7; text-shadow: 0 0 20px rgba(147, 51, 234, 0.8); }

        .chat-container {
            margin-top: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            max-height: 35vh;
            overflow-y: auto;
            backdrop-filter: blur(15px);
            text-align: left;
            transition: all 0.3s ease;
        }

        .chat-message {
            margin: 8px 0;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: clamp(13px, 3vw, 15px);
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            background: rgba(0, 212, 255, 0.15);
            margin-left: 15px;
            border-bottom-right-radius: 5px;
        }

        .chat-message.jarvis {
            background: rgba(0, 255, 136, 0.1);
            margin-right: 15px;
            border-bottom-left-radius: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .api-setup {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .api-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 25px;
            font-family: inherit;
            font-size: 13px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .api-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow);
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 25px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 25px;
            letter-spacing: 2px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn:active { background: var(--glow); transform: scale(0.95); }
        .btn-small { padding: 8px 16px; font-size: 11px; }

        .commands {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .command-chip {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--text);
        }

        .command-chip:active { background: rgba(0, 212, 255, 0.3); transform: scale(0.95); }
        .hidden { display: none !important; }

        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 200, 100, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            z-index: 1000;
            font-size: 13px;
            text-align: center;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="jarvis-core" id="jarvisCore">
            <div class="jarvis-icon">🤖</div>
        </div>

        <div class="status" id="status">J.A.R.V.I.S. EN LÍNEA</div>

        <!-- Setup API Key -->
        <div class="api-setup" id="apiSetup">
            <input type="password" class="api-input" id="apiKeyInput" 
                   placeholder="Pega tu API Key de Gemini aquí" autocomplete="off">
            <button class="btn btn-small" onclick="saveApiKey()">
                💾 CONECTAR A GEMINI
            </button>
            <small style="color: #888; font-size: 10px;">
                Consíguela gratis en 👉 aistudio.google.com
            </small>
        </div>

        <button class="btn hidden" id="btnStart" onclick="startListening()">
            🎤 INICIAR ESCUCHA
        </button>

        <!-- Chat -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-message jarvis">
                🤖 Bienvenido, jefe. Para conectar la IA pegue su API Key de Gemini arriba ↑
            </div>
        </div>

        <!-- Comandos rápidos -->
        <div class="commands">
            <div class="command-chip" onclick="speakCommand('Hola Jarvis')">👋 Hola</div>
            <div class="command-chip" onclick="speakCommand('Qué hora es')">🕐 Hora</div>
            <div class="command-chip" onclick="speakCommand('Cuéntame un chiste')">😄 Chiste</div>
            <div class="command-chip" onclick="speakCommand('Quién es el presidente de México')">🇲🇽 Política</div>
            <div class="command-chip" onclick="speakCommand('Dame un resumen de la historia de México')">📚 Historia</div>
            <div class="command-chip" onclick="speakCommand('Cómo hago tacos al pastor')">🌮 Receta</div>
        </div>
    </div>

    <script>
        // ============================================
        // J.A.R.V.I.S. AI - Gemini Integrado
        // ============================================

        const GEMINI_API_URL =
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent';

        let recognition;
        let synth = window.speechSynthesis;
        let isAwake = false;
        let isProcessing = false;
        let jarvisVoice = null;

        const jarvisCore = document.getElementById('jarvisCore');
        const statusDiv = document.getElementById('status');
        const chatContainer = document.getElementById('chatContainer');
        const apiSetup = document.getElementById('apiSetup');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const btnStart = document.getElementById('btnStart');

        // ============ FUNCIONES DE VOZ MEJORADA ============

        function setupJarvisVoice() {
            const voices = synth.getVoices();
            if (voices.length === 0) return;

            // Buscar la mejor voz: español México > español > cualquier español
            jarvisVoice = voices.find(v =>
                v.lang.includes('es-MX') && v.name.includes('Google')
            ) || voices.find(v =>
                v.lang.includes('es') && v.name.includes('Google')
            ) || voices.find(v =>
                v.lang.includes('es')
            );

            console.log('🎤 Voz seleccionada:', jarvisVoice?.name || 'Default');
        }

        function jarvisSpeak(text) {
            return new Promise((resolve) => {
                if (synth.speaking) synth.cancel();

                // Limpiar texto de asteriscos y caracteres especiales
                const cleanText = text
                    .replace(/\*/g, '')
                    .replace(/\#/g, '')
                    .replace(/\_/g, '')
                    .replace(/`/g, '')
                    .replace(/\[/g, '')
                    .replace(/\]/g, '')
                    .replace(/\(/g, '')
                    .replace(/\)/g, '')
                    .replace(/\{/g, '')
                    .replace(/\}/g, '')
                    .trim();

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'es-MX';
                utterance.rate = 0.82; // Más lento y natural
                utterance.pitch = 0.65; // Más grave (voz Jarvis)
                utterance.volume = 1;

                if (jarvisVoice) utterance.voice = jarvisVoice;

                jarvisCore.className = 'jarvis-core speaking';
                statusDiv.textContent = 'HABLANDO...';
                statusDiv.className = 'status status-speaking';

                utterance.onend = () => {
                    resetToListen();
                    resolve();
                };

                utterance.onerror = () => {
                    resetToListen();
                    resolve();
                };

                synth.speak(utterance);
            });
        }

        function resetToListen() {
            if (isAwake) {
                jarvisCore.className = 'jarvis-core listening';
                statusDiv.textContent = 'ESCUCHANDO...';
                statusDiv.className = 'status status-active';
            } else {
                jarvisCore.className = 'jarvis-core';
                statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
                statusDiv.className = 'status';
            }
        }

        // ============ API KEY ============

        function loadApiKey() {
            const saved = localStorage.getItem('jarvis_gemini_key');
            if (saved) {
                apiKeyInput.value = saved;
                apiSetup.classList.add('hidden');
                btnStart.classList.remove('hidden');
                return saved;
            }
            return null;
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showAlert('⚠️ Pegue su API Key primero');
                return;
            }
            if (!key.startsWith('AIza')) {
                showAlert('⚠️ Esa no parece una API Key válida de Google');
                return;
            }

            localStorage.setItem('jarvis_gemini_key', key);
            apiSetup.classList.add('hidden');
            btnStart.classList.remove('hidden');
            addMessage('jarvis',
                '✅ ¡API Key guardada! Ahora soy inteligente de verdad. Inicie la escucha con el botón o diga "Hola Jarvis".');
            jarvisSpeak('API Key guardada correctamente. Ahora puedo responder cualquier pregunta. Inicie la escucha cuando guste, jefe.');
        }

        // ============ CHAT ============

        function addMessage(type, text) {
            const msg = document.createElement('div');
            msg.className = `chat-message ${type}`;
            msg.textContent = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============ GEMINI API ============

        async function askGemini(question) {
            const apiKey = localStorage.getItem('jarvis_gemini_key');
            if (!apiKey) return null;

            try {
                const response = await fetch(`${GEMINI_API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Eres J.A.R.V.I.S., un asistente virtual mexicano. Hablas como un mexicano amigable y profesional, usando expresiones como "jefe", "patrón", "qué onda", "ándele", "no manches", etc. Eres servicial, ingenioso y tienes un toque de humor mexicano. Responde de manera útil y entretenida. La pregunta es: ${question}`
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.8,
                            maxOutputTokens: 500,
                        }
                    })
                });

                const data = await response.json();
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    return data.candidates[0].content.parts[0].text;
                }
                return null;
            } catch (error) {
                console.error('Error Gemini:', error);
                return null;
            }
        }

        // ============ PROCESAR COMANDOS ============

        async function processCommand(command) {
            if (isProcessing || !command || command.length < 3) return;
            isProcessing = true;
            resetAwakeTimer();

            addMessage('user', command);
            console.log('📝 Procesando:', command);

            // === COMANDOS RÁPIDOS (sin API) ===
            let quickResponse = null;

            if (command.includes('duerme') || command.includes('descansa') || command.includes('apágate')) {
                quickResponse = 'Entendido, jefe. Entrando en modo espera. Cuando me necesite, diga "Hola Jarvis".';
                addMessage('jarvis', quickResponse);
                await jarvisSpeak(quickResponse);
                goToSleep();
                isProcessing = false;
                return;
            }

            if (command.includes('hora') && command.length < 15) {
                const now = new Date();
                quickResponse =
                    `Son las ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')} horas, jefe.`;
                addMessage('jarvis', quickResponse);
                await jarvisSpeak(quickResponse);
                isProcessing = false;
                return;
            }

            if ((command.includes('día') || command.includes('fecha')) && command.length < 15) {
                const now = new Date();
                quickResponse = `Hoy es ${now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
                addMessage('jarvis', quickResponse);
                await jarvisSpeak(quickResponse);
                isProcessing = false;
                return;
            }

            if (command.includes('youtube') && command.length < 15) {
                quickResponse = 'Abriendo YouTube, jefe.';
                addMessage('jarvis', quickResponse);
                await jarvisSpeak(quickResponse);
                window.open('https://www.youtube.com', '_blank');
                isProcessing = false;
                return;
            }

            // === USAR GEMINI PARA RESPUESTAS INTELIGENTES ===
            const apiKey = localStorage.getItem('jarvis_gemini_key');

            if (apiKey) {
                jarvisCore.className = 'jarvis-core thinking';
                statusDiv.textContent = 'PENSANDO...';
                statusDiv.className = 'status status-thinking';

                const thinkingMsg = document.createElement('div');
                thinkingMsg.className = 'chat-message jarvis';
                thinkingMsg.textContent = '💭 Pensando...';
                thinkingMsg.id = 'thinkingMsg';
                chatContainer.appendChild(thinkingMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                const aiResponse = await askGemini(command);

                // Quitar mensaje de "pensando"
                const thinkEl = document.getElementById('thinkingMsg');
                if (thinkEl) thinkEl.remove();

                if (aiResponse) {
                    addMessage('jarvis', aiResponse);
                    await jarvisSpeak(aiResponse);
                } else {
                    const fallback = 'Lo siento, jefe. No pude conectar con la IA. Revise su conexión a internet.';
                    addMessage('jarvis', fallback);
                    await jarvisSpeak(fallback);
                }
            } else {
                // Sin API Key
                const fallback =
                    'No tengo la API Key de Gemini configurada, jefe. Péguela en el campo de arriba para que pueda responder cualquier pregunta.';
                addMessage('jarvis', fallback);
                await jarvisSpeak(fallback);
                apiSetup.classList.remove('hidden');
                btnStart.classList.add('hidden');
            }

            isProcessing = false;
        }

        // ============ ESTADOS JARVIS ============

        async function wakeUpJarvis() {
            if (isAwake || isProcessing) return;
            isAwake = true;
            isProcessing = true;

            jarvisCore.className = 'jarvis-core listening';
            statusDiv.textContent = 'DESPERTANDO...';
            statusDiv.className = 'status status-active';

            const hour = new Date().getHours();
            let greeting = 'Buenas noches';
            if (hour >= 6 && hour < 12) greeting = 'Buenos días';
            else if (hour >= 12 && hour < 18) greeting = 'Buenas tardes';

            const hasKey = localStorage.getItem('jarvis_gemini_key');
            const phrase = hasKey ?
                `${greeting}, jefe. Soy Jarvis con inteligencia artificial. ¿En qué puedo ayudarle hoy?` :
                `${greeting}, jefe. Soy Jarvis. Si configura la API Key de Gemini podré responder cualquier cosa.`;

            addMessage('jarvis', phrase);
            await jarvisSpeak(phrase);
            isProcessing = false;
            resetAwakeTimer();
        }

        let awakeTimer;

        function resetAwakeTimer() {
            clearTimeout(awakeTimer);
            awakeTimer = setTimeout(() => {
                if (isAwake && !isProcessing) goToSleep();
            }, 60000);
        }

        async function goToSleep() {
            isAwake = false;
            jarvisCore.className = 'jarvis-core';
            statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
            statusDiv.className = 'status';
            addMessage('jarvis', '😴 Entrando en modo espera. Diga "Hola Jarvis" cuando me necesite.');
        }

        // ============ RECONOCIMIENTO DE VOZ ============

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                addMessage('jarvis', '⚠️ Navegador no soporta reconocimiento de voz. Use Chrome.');
                return null;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-MX';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const last = event.results[event.results.length - 1];
                if (last?.[0]) {
                    const command = last[0].transcript.toLowerCase().trim();
                    console.log('🎤 Detectado:', command);

                    if (!isAwake && !isProcessing &&
                        (command.includes('hola jarvis') || command.includes('oye jarvis') || command.includes(
                            'despierta jarvis'))) {
                        wakeUpJarvis();
                    } else if (isAwake && !isProcessing && command.length > 2) {
                        processCommand(command);
                    }
                }
            };

            recognition.onerror = function(event) {
                console.error('Error:', event.error);
                if (event.error === 'not-allowed') {
                    showAlert('❌ Permiso de micrófono denegado');
                }
                setTimeout(() => {
                    try { if (recognition) recognition.start(); } catch (e) {}
                }, 1000);
            };

            recognition.onend = function() {
                if (!isProcessing) {
                    setTimeout(() => {
                        try { if (recognition) recognition.start(); } catch (e) {}
                    }, 300);
                }
            };

            return recognition;
        }

        async function startListening() {
            btnStart.style.display = 'none';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                showAlert('❌ Necesito permiso al micrófono');
                btnStart.classList.remove('hidden');
                return;
            }

            recognition = initSpeechRecognition();
            if (recognition) {
                try {
                    recognition.start();
                    statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
                    addMessage('jarvis', '✅ Escucha iniciada. Di "Hola Jarvis" para activarme.');
                    showAlert('✅ Listo. Di "Hola Jarvis"');
                } catch (e) {
                    showAlert('Error al iniciar. Recarga la página.');
                    btnStart.classList.remove('hidden');
                }
            }
        }

        function speakCommand(text) {
            if (!isAwake) {
                wakeUpJarvis().then(() => {
                    setTimeout(() => processCommand(text.toLowerCase()), 2000);
                });
            } else {
                processCommand(text.toLowerCase());
            }
        }

        // ============ UTILIDADES ============

        function showAlert(msg) {
            const alert = document.createElement('div');
            alert.className = 'alert';
            alert.textContent = msg;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = Math.random() * 10 + 5 + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                container.appendChild(p);
            }
        }

        // ============ INICIALIZACIÓN ============

        window.onload = function() {
            createParticles();
            setupJarvisVoice();
            synth.onvoiceschanged = setupJarvisVoice;

            const savedKey = loadApiKey();
            if (!savedKey) {
                apiSetup.classList.remove('hidden');
                btnStart.classList.add('hidden');
            } else {
                apiSetup.classList.add('hidden');
                btnStart.classList.remove('hidden');
                // Auto-iniciar si ya tiene API Key
                setTimeout(startListening, 500);
            }

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && recognition && !isProcessing) {
                    try { recognition.start(); } catch (e) {}
                }
            });

            console.log('🤖 J.A.R.V.I.S. AI listo');
            console.log('💡 Di "Hola Jarvis" para activar');
            console.log('🧠 Gemini integrado para respuestas inteligentes');
        };
    </script>
</body>
</html>
