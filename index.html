<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. AI</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --primary: #00d4ff;
            --secondary: #0066ff;
            --text: #e0e0ff;
            --glow: rgba(0, 212, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Courier New', monospace;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0.2;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 95%;
            max-width: 500px;
            text-align: center;
            padding: 15px;
        }

        .jarvis-core {
            width: min(180px, 45vw);
            height: min(180px, 45vw);
            margin: 0 auto 20px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                    rgba(0, 212, 255, 0.1) 0%,
                    rgba(0, 102, 255, 0.05) 40%,
                    transparent 70%);
            border: 3px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 40px var(--glow), inset 0 0 40px var(--glow);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .jarvis-core:active {
            transform: scale(0.95);
        }

        .jarvis-core.listening {
            border-color: rgba(0, 255, 136, 0.8);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.5), inset 0 0 60px rgba(0, 255, 136, 0.3);
            animation: pulseGreen 1.5s ease-in-out infinite;
        }

        .jarvis-core.speaking {
            border-color: rgba(255, 170, 0, 0.8);
            box-shadow: 0 0 60px rgba(255, 170, 0, 0.5), inset 0 0 60px rgba(255, 170, 0, 0.3);
            animation: pulseOrange 0.8s ease-in-out infinite;
        }

        .jarvis-core.thinking {
            border-color: rgba(147, 51, 234, 0.8);
            box-shadow: 0 0 60px rgba(147, 51, 234, 0.5), inset 0 0 60px rgba(147, 51, 234, 0.3);
            animation: pulsePurple 1s ease-in-out infinite;
        }

        .jarvis-core.error-state {
            border-color: rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.5), inset 0 0 60px rgba(255, 0, 0, 0.3);
        }

        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.5), inset 0 0 40px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 80px rgba(0, 255, 136, 0.8), inset 0 0 80px rgba(0, 255, 136, 0.5); }
        }

        @keyframes pulseOrange {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 170, 0, 0.5), inset 0 0 40px rgba(255, 170, 0, 0.3); }
            50% { box-shadow: 0 0 80px rgba(255, 170, 0, 0.8), inset 0 0 80px rgba(255, 170, 0, 0.5); }
        }

        @keyframes pulsePurple {
            0%, 100% { box-shadow: 0 0 40px rgba(147, 51, 234, 0.5), inset 0 0 40px rgba(147, 51, 234, 0.3); }
            50% { box-shadow: 0 0 80px rgba(147, 51, 234, 0.8), inset 0 0 80px rgba(147, 51, 234, 0.5); }
        }

        .jarvis-core::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--primary);
            animation: spin 3s linear infinite;
        }

        .jarvis-core::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1px solid transparent;
            border-bottom-color: var(--secondary);
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .jarvis-icon {
            font-size: min(55px, 13vw);
            z-index: 1;
            filter: drop-shadow(0 0 20px var(--primary));
            pointer-events: none;
        }

        .listening .jarvis-icon { filter: drop-shadow(0 0 30px #00ff88); animation: flicker 0.3s infinite; }
        .speaking .jarvis-icon { filter: drop-shadow(0 0 30px #ffaa00); animation: flicker 0.2s infinite; }
        .thinking .jarvis-icon { filter: drop-shadow(0 0 30px #a855f7); animation: flicker 0.5s infinite; }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status {
            font-size: clamp(14px, 3.5vw, 18px);
            color: var(--primary);
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .status-active { color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.8); }
        .status-speaking { color: #ffaa00; text-shadow: 0 0 20px rgba(255, 170, 0, 0.8); }
        .status-thinking { color: #a855f7; text-shadow: 0 0 20px rgba(147, 51, 234, 0.8); }
        .status-error { color: #ff4444; text-shadow: 0 0 20px rgba(255, 0, 0, 0.8); }

        .chat-container {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            max-height: 35vh;
            overflow-y: auto;
            backdrop-filter: blur(15px);
            text-align: left;
        }

        .chat-message {
            margin: 6px 0;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: clamp(12px, 3vw, 14px);
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            background: rgba(0, 212, 255, 0.15);
            margin-left: 15px;
            border-bottom-right-radius: 5px;
        }

        .chat-message.jarvis {
            background: rgba(0, 255, 136, 0.1);
            margin-right: 15px;
            border-bottom-left-radius: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 30px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 25px;
            letter-spacing: 2px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn:active { background: var(--glow); transform: scale(0.95); }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .btn-red {
            border-color: #ff4444;
            color: #ff4444;
        }

        .commands {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }

        .command-chip {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--text);
        }

        .command-chip:active { background: rgba(0, 212, 255, 0.3); transform: scale(0.95); }

        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="jarvis-core" id="jarvisCore" onclick="toggleJarvis()">
            <div class="jarvis-icon">🤖</div>
        </div>

        <div class="status" id="status">TOCA EL CÍRCULO PARA INICIAR</div>

        <!-- Chat -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-message jarvis">
                🤖 <strong>Toca el círculo</strong> para iniciar o di <strong>"Hola Jarvis"</strong>
            </div>
        </div>

        <!-- Controles -->
        <div class="controls">
            <button class="btn btn-small" id="btnRestart" onclick="restartRecognition()">
                🔄 Reiniciar
            </button>
        </div>

        <!-- Comandos -->
        <div class="commands">
            <div class="command-chip" onclick="sendCommand('Hola Jarvis')">👋 Hola</div>
            <div class="command-chip" onclick="sendCommand('Qué hora es')">🕐 Hora</div>
            <div class="command-chip" onclick="sendCommand('Cuéntame un chiste')">😄 Chiste</div>
            <div class="command-chip" onclick="sendCommand('Qué día es hoy')">📅 Fecha</div>
            <div class="command-chip" onclick="sendCommand('Ábreme YouTube')">▶️ YouTube</div>
            <div class="command-chip" onclick="sendCommand('Busca en Google noticias')">🔍 Buscar</div>
        </div>
    </div>

    <script>
        // ============================================
        // J.A.R.V.I.S. v3.0 - CORREGIDO Y FUNCIONAL
        // ============================================

        let recognition = null;
        let synth = window.speechSynthesis;
        let isAwake = false;
        let isProcessing = false;
        let jarvisVoice = null;
        let restartTimeout = null;

        const jarvisCore = document.getElementById('jarvisCore');
        const statusDiv = document.getElementById('status');
        const chatContainer = document.getElementById('chatContainer');

        // ============ BASE DE CONOCIMIENTOS ============
        const knowledgeBase = {
            'hola': [
                '¡Qué onda, jefe! ¿Todo bien? ¿En qué le ayudo?',
                '¡Aquí andamos, patrón! Dígame qué necesita.',
                'Todo en orden, mi estimado. ¿Qué desea hacer hoy?',
                '¡Eso que ni qué, jefe! ¿Qué se le ofrece?',
            ],
            'cómo estás': [
                '¡Al cien, jefe! Todos los sistemas funcionando correctamente.',
                'De maravilla, patrón. Procesadores al máximo y listo para servirle.',
            ],
            'hora': () => {
                const now = new Date();
                const h = now.getHours();
                const m = now.getMinutes().toString().padStart(2, '0');
                return `Son las ${h}:${m} horas, jefe. ${h < 12 ? 'De la mañana' : h < 18 ? 'De la tarde' : 'De la noche'}.`;
            },
            'fecha': () => {
                const now = new Date();
                return `Hoy es ${now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
            },
            'día': () => {
                const now = new Date();
                return `Hoy es ${now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
            },
            'chiste': [
                '¿Qué le dice un semáforo a otro? No me mires, que me estoy cambiando. ¡Ja, ja, ja!',
                '¿Por qué los programadores confunden Halloween con Navidad? Porque Oct 31 == Dec 25.',
                'Un developer entra a un bar. Pide 1, 2, 0, 99999, -1, y una iguana. Así somos, jefe.',
                '¿Qué hace un mulo en programación? ¡Back-end!',
            ],
            'broma': [
                '¿Qué le dice un semáforo a otro? No me mires, que me estoy cambiando.',
            ],
            'qué puedes hacer': [
                'Puedo: decir hora y fecha, contar chistes, abrir YouTube, buscar en Google, y hasta platicar. También funciono con comandos de voz o tocando los botones.',
            ],
            'presidente': [
                'La presidenta de México es Claudia Sheinbaum, la primera mujer en el cargo. ¡Histórico!',
            ],
            'gracias': [
                'De nada, jefe. Para eso estamos.',
                'No hay de qué, patrón. Es un placer servirle.',
            ],
            'adiós': [
                '¡Hasta luego, jefe! Aquí estaré cuando me necesite.',
            ],
        };

        function findLocalAnswer(command) {
            const lower = command.toLowerCase().trim();
            for (const [key, value] of Object.entries(knowledgeBase)) {
                if (lower.includes(key)) {
                    if (typeof value === 'function') return value();
                    return value[Math.floor(Math.random() * value.length)];
                }
            }
            return null;
        }

        function getFallbackResponse(command) {
            const fallbacks = [
                `No tengo información sobre "${command}", jefe. Pero puedo buscar en Google si quiere.`,
                `Esa no me la sé, patrón. ¿Qué tal si me pide: hora, fecha, o un chiste?`,
                `Interesante pregunta. Diga "busca en Google ${command}" y lo investigo.`,
            ];
            return fallbacks[Math.floor(Math.random() * fallbacks.length)];
        }

        // ============ VOZ ============
        function setupJarvisVoice() {
            const voices = synth.getVoices();
            if (voices.length === 0) return;

            jarvisVoice = voices.find(v =>
                v.lang.includes('es-MX') && v.name.includes('Google')
            ) || voices.find(v =>
                v.lang.includes('es') && v.name.includes('Google')
            ) || voices.find(v =>
                v.lang.includes('es')
            );

            console.log('🎤 Voz seleccionada:', jarvisVoice?.name || 'Default');
        }

        function jarvisSpeak(text) {
            return new Promise((resolve) => {
                try {
                    if (synth.speaking) {
                        synth.cancel();
                    }

                    const cleanText = text.replace(/[\*\_\`\[\]\(\)\{\}\#]/g, '').trim();
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = 'es-MX';
                    utterance.rate = 0.85;
                    utterance.pitch = 0.65;
                    utterance.volume = 1;

                    if (jarvisVoice) utterance.voice = jarvisVoice;

                    jarvisCore.className = 'jarvis-core speaking';
                    statusDiv.textContent = 'HABLANDO...';
                    statusDiv.className = 'status status-speaking';

                    let resolved = false;

                    utterance.onend = () => {
                        if (!resolved) {
                            resolved = true;
                            console.log('✅ Terminó de hablar');
                            resetToListenState();
                            resolve();
                        }
                    };

                    utterance.onerror = (e) => {
                        if (!resolved) {
                            resolved = true;
                            console.error('Error al hablar:', e);
                            resetToListenState();
                            resolve();
                        }
                    };

                    // Timeout de seguridad (15 segundos máximo)
                    setTimeout(() => {
                        if (!resolved) {
                            resolved = true;
                            console.log('⏰ Timeout de voz');
                            synth.cancel();
                            resetToListenState();
                            resolve();
                        }
                    }, 15000);

                    synth.speak(utterance);
                } catch (e) {
                    console.error('Error en jarvisSpeak:', e);
                    resetToListenState();
                    resolve();
                }
            });
        }

        function resetToListenState() {
            if (isAwake && !isProcessing) {
                jarvisCore.className = 'jarvis-core listening';
                statusDiv.textContent = 'ESCUCHANDO...';
                statusDiv.className = 'status status-active';
                console.log('🟢 Modo: Escuchando');
            } else if (!isAwake) {
                jarvisCore.className = 'jarvis-core';
                statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
                statusDiv.className = 'status';
                console.log('🔵 Modo: En espera');
            }
        }

        // ============ CHAT ============
        function addMessage(type, text) {
            const msg = document.createElement('div');
            msg.className = `chat-message ${type}`;
            msg.textContent = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============ PROCESAR COMANDOS ============
        async function processCommand(command) {
            if (isProcessing || !command || command.length < 2) {
                console.log('⚠️ No se puede procesar:', { isProcessing, command });
                return;
            }

            isProcessing = true;
            resetAwakeTimer();

            addMessage('user', command);
            console.log('📝 Procesando comando:', command);

            let response = '';
            let action = null;

            // Comandos de control
            if (command.includes('duerme') || command.includes('descansa') || command.includes('apágate')) {
                response = 'Entendido, jefe. Entrando en modo espera. Diga "Hola Jarvis" o toque el círculo cuando me necesite.';
                addMessage('jarvis', response);
                await jarvisSpeak(response);
                goToSleep();
                isProcessing = false;
                return;
            }

            // Comandos de acción
            if (command.includes('youtube') || command.includes('yutub')) {
                response = 'Abriendo YouTube, jefe.';
                action = () => window.open('https://www.youtube.com', '_blank');
            } else if (command.includes('google') && !command.includes('busca')) {
                response = 'Abriendo Google.';
                action = () => window.open('https://www.google.com', '_blank');
            } else if (command.includes('busca') || command.includes('buscar') || command.includes('googlea') ||
                command.includes('investiga')) {
                const query = command.replace(/busca|buscar|google|googlea|investiga|en google/g, '').trim();
                if (query && query.length > 2) {
                    response = `Buscando "${query}" en Google, jefe...`;
                    action = () => window.open(
                        `https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                } else {
                    response = '¿Qué quiere que busque, jefe? Diga "busca" y luego el tema.';
                }
            } else {
                // Buscar en base local
                const localAnswer = findLocalAnswer(command);
                if (localAnswer) {
                    response = localAnswer;
                } else {
                    response = getFallbackResponse(command);
                }
            }

            addMessage('jarvis', response);

            if (action) {
                setTimeout(() => action(), 1000);
            }

            await jarvisSpeak(response);
            console.log('✅ Comando procesado');

            isProcessing = false;
        }

        // ============ ESTADOS ============
        async function wakeUpJarvis() {
            if (isAwake || isProcessing) {
                console.log('⚠️ Ya está despierto o procesando');
                return;
            }

            isAwake = true;
            isProcessing = true;

            jarvisCore.className = 'jarvis-core listening';
            statusDiv.textContent = 'DESPERTANDO...';
            statusDiv.className = 'status status-active';

            const hour = new Date().getHours();
            let greeting = 'Buenas noches';
            if (hour >= 6 && hour < 12) greeting = 'Buenos días';
            else if (hour >= 12 && hour < 18) greeting = 'Buenas tardes';

            const phrase =
                `${greeting}, jefe. Soy Jarvis, su asistente. ¿En qué puedo servirle? Puede hablarme o tocar los botones.`;

            addMessage('jarvis', phrase);
            await jarvisSpeak(phrase);

            isProcessing = false;
            resetAwakeTimer();
            console.log('✅ JARVIS despierto y escuchando');
        }

        let awakeTimer;

        function resetAwakeTimer() {
            clearTimeout(awakeTimer);
            awakeTimer = setTimeout(() => {
                if (isAwake && !isProcessing) {
                    console.log('⏰ Timer de inactividad');
                    goToSleep();
                }
            }, 45000); // 45 segundos
        }

        async function goToSleep() {
            isAwake = false;
            jarvisCore.className = 'jarvis-core';
            statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
            statusDiv.className = 'status';
            console.log('😴 Modo espera');
        }

        // ============ RECONOCIMIENTO DE VOZ ============
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                addMessage('jarvis', '⚠️ Use Chrome para reconocimiento de voz.');
                statusDiv.textContent = '⚠️ USAR CHROME';
                return null;
            }

            // Destruir instancia anterior
            if (recognition) {
                try {
                    recognition.stop();
                    recognition.abort();
                } catch (e) {}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-MX';
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                console.log('🎤 Reconocimiento INICIADO');
            };

            recognition.onresult = function(event) {
                console.log('🎤 Resultado recibido:', event.results.length);

                const lastResult = event.results[event.results.length - 1];
                if (lastResult && lastResult[0]) {
                    const command = lastResult[0].transcript.toLowerCase().trim();
                    console.log('🎤 Texto detectado:', command);

                    if (!isAwake && !isProcessing) {
                        // Buscar activación
                        if (command.includes('hola jarvis') ||
                            command.includes('oye jarvis') ||
                            command.includes('despierta jarvis') ||
                            command.includes('jarvis despierta') ||
                            command.includes('hola') && command.includes('jarvis')) {
                            console.log('🚀 Activando JARVIS...');
                            wakeUpJarvis();
                        }
                    } else if (isAwake && !isProcessing && command.length > 2) {
                        console.log('📝 Enviando a procesar:', command);
                        processCommand(command);
                    }
                }
            };

            recognition.onerror = function(event) {
                console.error('❌ Error reconocimiento:', event.error);

                if (event.error === 'not-allowed') {
                    statusDiv.textContent = '❌ MICRÓFONO BLOQUEADO';
                    statusDiv.className = 'status status-error';
                    jarvisCore.className = 'jarvis-core error-state';
                }

                if (event.error === 'no-speech') {
                    console.log('🔇 Sin voz detectada');
                }

                // Reiniciar después de error
                if (!isProcessing) {
                    restartRecognition();
                }
            };

            recognition.onend = function() {
                console.log('🛑 Reconocimiento terminado');

                // Reiniciar si no está procesando
                if (!isProcessing) {
                    console.log('🔄 Reiniciando reconocimiento automático...');
                    restartRecognition();
                }
            };

            return recognition;
        }

        function startRecognition() {
            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (recognition) {
                try {
                    recognition.start();
                    console.log('✅ Reconocimiento iniciado exitosamente');
                    statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
                    statusDiv.className = 'status';
                    jarvisCore.className = 'jarvis-core';
                } catch (e) {
                    console.error('Error al iniciar reconocimiento:', e);
                    // Intentar de nuevo
                    setTimeout(() => {
                        try {
                            recognition.start();
                        } catch (e2) {
                            console.error('Segundo intento fallido');
                        }
                    }, 1000);
                }
            }
        }

        function restartRecognition() {
            clearTimeout(restartTimeout);
            restartTimeout = setTimeout(() => {
                try {
                    if (recognition) {
                        recognition.abort();
                    }
                } catch (e) {}

                recognition = null;
                recognition = initSpeechRecognition();

                if (recognition) {
                    try {
                        recognition.start();
                        console.log('✅ Reconocimiento reiniciado');
                    } catch (e) {
                        console.error('Error al reiniciar:', e);
                    }
                }
            }, 500);
        }

        // ============ INTERACCIÓN MANUAL ============
        async function toggleJarvis() {
            if (isProcessing) {
                console.log('⚠️ Ocupado, espere...');
                return;
            }

            if (!isAwake) {
                // Iniciar reconocimiento si no existe
                if (!recognition) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        stream.getTracks().forEach(track => track.stop());
                        startRecognition();
                    } catch (e) {
                        alert('❌ Se necesita permiso al micrófono. Recarga la página y permite el acceso.');
                        return;
                    }
                }
                await wakeUpJarvis();
            } else {
                await goToSleep();
                addMessage('jarvis', '😴 Modo espera. Toque el círculo o diga "Hola Jarvis".');
            }
        }

        function sendCommand(text) {
            if (!isAwake && text.toLowerCase().includes('hola jarvis')) {
                if (!recognition) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            stream.getTracks().forEach(track => track.stop());
                            startRecognition();
                            wakeUpJarvis();
                        })
                        .catch(() => {
                            alert('❌ Se necesita permiso al micrófono.');
                        });
                } else {
                    wakeUpJarvis();
                }
            } else if (isAwake && !isProcessing) {
                processCommand(text.toLowerCase());
            } else if (!isAwake) {
                addMessage('jarvis', '🤖 Primero active JARVIS diciendo "Hola Jarvis" o tocando el círculo.');
            }
        }

        // ============ PARTÍCULAS ============
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = Math.random() * 10 + 5 + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                container.appendChild(p);
            }
        }

        // ============ INICIALIZACIÓN ============
        async function init() {
            createParticles();
            setupJarvisVoice();
            synth.onvoiceschanged = setupJarvisVoice;

            // Pedir permiso de micrófono al inicio
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                console.log('✅ Permiso de micrófono concedido');
                startRecognition();
            } catch (e) {
                console.log('⏳ Permiso de micrófono pendiente');
                statusDiv.textContent = 'TOCA EL CÍRCULO PARA INICIAR';
                statusDiv.className = 'status';
            }

            // Evento de visibilidad
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && !isProcessing) {
                    console.log('👁️ Página visible, reiniciando reconocimiento');
                    restartRecognition();
                }
            });

            // Mantener vivo el reconocimiento cada 30 segundos
            setInterval(() => {
                if (!isProcessing && recognition) {
                    try {
                        if (recognition.state === 'inactive' || recognition.state === 'ended') {
                            console.log('🔄 Reinicio periódico');
                            recognition.start();
                        }
                    } catch (e) {
                        console.log('⚠️ Error en reinicio periódico');
                    }
                }
            }, 30000);

            console.log('🤖 J.A.R.V.I.S. v3.0 CORREGIDO');
            console.log('💡 Di "Hola Jarvis" o toca el círculo');
            console.log('🔄 El reconocimiento se reinicia automáticamente');
        }

        // Iniciar
        window.onload = init;
    </script>
</body>
