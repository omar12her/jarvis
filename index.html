<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. AI</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --primary: #00d4ff;
            --secondary: #0066ff;
            --text: #e0e0ff;
            --glow: rgba(0, 212, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Courier New', monospace;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0.2;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 95%;
            max-width: 500px;
            text-align: center;
            padding: 15px;
        }

        .jarvis-core {
            width: min(180px, 45vw);
            height: min(180px, 45vw);
            margin: 0 auto 25px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                    rgba(0, 212, 255, 0.1) 0%,
                    rgba(0, 102, 255, 0.05) 40%,
                    transparent 70%);
            border: 3px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 40px var(--glow), inset 0 0 40px var(--glow);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .jarvis-core.listening {
            border-color: rgba(0, 255, 136, 0.8);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.5), inset 0 0 60px rgba(0, 255, 136, 0.3);
            animation: pulseGreen 1.5s ease-in-out infinite;
        }

        .jarvis-core.speaking {
            border-color: rgba(255, 170, 0, 0.8);
            box-shadow: 0 0 60px rgba(255, 170, 0, 0.5), inset 0 0 60px rgba(255, 170, 0, 0.3);
            animation: pulseOrange 0.8s ease-in-out infinite;
        }

        .jarvis-core.thinking {
            border-color: rgba(147, 51, 234, 0.8);
            box-shadow: 0 0 60px rgba(147, 51, 234, 0.5), inset 0 0 60px rgba(147, 51, 234, 0.3);
            animation: pulsePurple 1s ease-in-out infinite;
        }

        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.5), inset 0 0 40px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 80px rgba(0, 255, 136, 0.8), inset 0 0 80px rgba(0, 255, 136, 0.5); }
        }

        @keyframes pulseOrange {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 170, 0, 0.5), inset 0 0 40px rgba(255, 170, 0, 0.3); }
            50% { box-shadow: 0 0 80px rgba(255, 170, 0, 0.8), inset 0 0 80px rgba(255, 170, 0, 0.5); }
        }

        @keyframes pulsePurple {
            0%, 100% { box-shadow: 0 0 40px rgba(147, 51, 234, 0.5), inset 0 0 40px rgba(147, 51, 234, 0.3); }
            50% { box-shadow: 0 0 80px rgba(147, 51, 234, 0.8), inset 0 0 80px rgba(147, 51, 234, 0.5); }
        }

        .jarvis-core::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--primary);
            animation: spin 3s linear infinite;
        }

        .jarvis-core::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1px solid transparent;
            border-bottom-color: var(--secondary);
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .jarvis-icon {
            font-size: min(55px, 13vw);
            z-index: 1;
            filter: drop-shadow(0 0 20px var(--primary));
        }

        .listening .jarvis-icon { filter: drop-shadow(0 0 30px #00ff88); animation: flicker 0.3s infinite; }
        .speaking .jarvis-icon { filter: drop-shadow(0 0 30px #ffaa00); animation: flicker 0.2s infinite; }
        .thinking .jarvis-icon { filter: drop-shadow(0 0 30px #a855f7); animation: flicker 0.5s infinite; }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status {
            font-size: clamp(14px, 3.5vw, 18px);
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .status-active { color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.8); }
        .status-speaking { color: #ffaa00; text-shadow: 0 0 20px rgba(255, 170, 0, 0.8); }
        .status-thinking { color: #a855f7; text-shadow: 0 0 20px rgba(147, 51, 234, 0.8); }

        .chat-container {
            margin-top: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            max-height: 40vh;
            overflow-y: auto;
            backdrop-filter: blur(15px);
            text-align: left;
            transition: all 0.3s ease;
        }

        .chat-message {
            margin: 8px 0;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: clamp(13px, 3vw, 15px);
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            background: rgba(0, 212, 255, 0.15);
            margin-left: 15px;
            border-bottom-right-radius: 5px;
        }

        .chat-message.jarvis {
            background: rgba(0, 255, 136, 0.1);
            margin-right: 15px;
            border-bottom-left-radius: 5px;
        }

        .chat-message.error {
            background: rgba(255, 0, 0, 0.1);
            margin-right: 15px;
            border-bottom-left-radius: 5px;
            color: #ff6b6b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .api-setup {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .api-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 25px;
            font-family: inherit;
            font-size: 13px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .api-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow);
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 25px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 25px;
            letter-spacing: 2px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn:active { background: var(--glow); transform: scale(0.95); }
        .btn-small { padding: 8px 16px; font-size: 11px; }

        .btn-link {
            background: rgba(0, 212, 255, 0.1);
            border: 1px dashed var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 20px;
            text-decoration: none;
            display: inline-block;
        }

        .commands {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .command-chip {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--text);
        }

        .command-chip:active { background: rgba(0, 212, 255, 0.3); transform: scale(0.95); }
        .hidden { display: none !important; }

        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 200, 100, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            z-index: 1000;
            font-size: 13px;
            text-align: center;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="jarvis-core" id="jarvisCore">
            <div class="jarvis-icon">🤖</div>
        </div>

        <div class="status" id="status">J.A.R.V.I.S. EN LÍNEA</div>

        <!-- Setup API Key -->
        <div class="api-setup" id="apiSetup">
            <input type="password" class="api-input" id="apiKeyInput" 
                   placeholder="Pega tu API Key de Gemini (AIzaSy...)" autocomplete="off">
            <button class="btn btn-small" onclick="saveApiKey()">
                💾 CONECTAR A GEMINI
            </button>
            <small style="color: #ffaa00; font-size: 10px;">
                ⚠️ Tu clave debe empezar con AIzaSy... No AQ.Ab8...
            </small>
            <br>
            <a href="https://aistudio.google.com/apikey" target="_blank" class="btn-link">
                🔑 CONSEGUIR API KEY CORRECTA AQUÍ
            </a>
        </div>

        <button class="btn hidden" id="btnStart" onclick="startListening()">
            🎤 INICIAR JARVIS
        </button>

        <!-- Chat -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-message jarvis">
                🤖 Bienvenido, jefe. Necesito una API Key de Gemini que empiece con <strong>AIzaSy...</strong><br>
                <small style="color: #ffaa00;">La clave AQ.Ab8... no funciona con Gemini</small>
            </div>
        </div>

        <!-- Comandos -->
        <div class="commands">
            <div class="command-chip" onclick="speakCommand('Hola Jarvis')">👋 Hola</div>
            <div class="command-chip" onclick="speakCommand('Qué hora es')">🕐 Hora</div>
            <div class="command-chip" onclick="speakCommand('Cuéntame un chiste')">😄 Chiste</div>
            <div class="command-chip" onclick="speakCommand('Quién es el presidente de México')">🇲🇽 México</div>
        </div>
    </div>

    <script>
        // ============================================
        // J.A.R.V.I.S. AI - Adaptado para Gemini
        // ============================================

        const GEMINI_MODELS = [
            'gemini-pro',
            'gemini-1.5-flash',
            'gemini-flash-latest'
        ];

        let recognition;
        let synth = window.speechSynthesis;
        let isAwake = false;
        let isProcessing = false;
        let jarvisVoice = null;

        const jarvisCore = document.getElementById('jarvisCore');
        const statusDiv = document.getElementById('status');
        const chatContainer = document.getElementById('chatContainer');
        const apiSetup = document.getElementById('apiSetup');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const btnStart = document.getElementById('btnStart');

        // ============ BASE DE CONOCIMIENTOS (funciona sin API) ============
        const knowledgeBase = {
            'hola': [
                '¡Qué onda, jefe! ¿Todo bien? ¿En qué le ayudo?',
                '¡Aquí andamos, patrón! Dígame qué necesita.',
                'Todo en orden, mi estimado. ¿Qué desea hacer hoy?',
            ],
            'cómo estás': [
                '¡Al cien, jefe! Todos los sistemas funcionando. ¿Usted cómo está?',
                'De maravilla, patrón. Procesadores listos para servirle.',
            ],
            'hora': () => {
                const now = new Date();
                return `Son las ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')} horas, jefe.`;
            },
            'fecha': () => {
                const now = new Date();
                return `Hoy es ${now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
            },
            'día': () => {
                const now = new Date();
                return `Hoy es ${now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
            },
            'chiste': [
                '¿Qué le dice un semáforo a otro? No me mires, que me estoy cambiando. ¡Ja, ja, ja!',
                '¿Por qué los programadores confunden Halloween con Navidad? Porque Oct 31 == Dec 25.',
                'Un developer entra a un bar. Pide 1, 2, 0, 99999, -1, y una iguana.',
            ],
            'presidente': [
                'La presidenta de México es Claudia Sheinbaum, la primera mujer en ocupar el cargo. ¡Histórico, jefe!',
            ],
            'gracias': [
                'De nada, jefe. Para eso estamos.',
                'No hay de qué, patrón. Es un placer.',
            ],
        };

        function findAnswer(command) {
            const lower = command.toLowerCase().trim();
            for (const [key, value] of Object.entries(knowledgeBase)) {
                if (lower.includes(key)) {
                    if (typeof value === 'function') return value();
                    return value[Math.floor(Math.random() * value.length)];
                }
            }
            return null;
        }

        // ============ VOZ MEJORADA ============
        function setupJarvisVoice() {
            const voices = synth.getVoices();
            if (voices.length === 0) return;

            jarvisVoice = voices.find(v =>
                v.lang.includes('es-MX') && v.name.includes('Google')
            ) || voices.find(v =>
                v.lang.includes('es') && v.name.includes('Google')
            ) || voices.find(v =>
                v.lang.includes('es')
            );

            console.log('🎤 Voz:', jarvisVoice?.name || 'Default');
        }

        function jarvisSpeak(text) {
            return new Promise((resolve) => {
                if (synth.speaking) synth.cancel();
                const cleanText = text.replace(/[\*\_\`\[\]\(\)\{\}]/g, '').trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'es-MX';
                utterance.rate = 0.82;
                utterance.pitch = 0.65;
                utterance.volume = 1;
                if (jarvisVoice) utterance.voice = jarvisVoice;

                jarvisCore.className = 'jarvis-core speaking';
                statusDiv.textContent = 'HABLANDO...';
                statusDiv.className = 'status status-speaking';

                utterance.onend = () => {
                    resetToListen();
                    resolve();
                };
                utterance.onerror = () => {
                    resetToListen();
                    resolve();
                };
                synth.speak(utterance);
            });
        }

        function resetToListen() {
            if (isAwake) {
                jarvisCore.className = 'jarvis-core listening';
                statusDiv.textContent = 'ESCUCHANDO...';
                statusDiv.className = 'status status-active';
            } else {
                jarvisCore.className = 'jarvis-core';
                statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
                statusDiv.className = 'status';
            }
        }

        // ============ API KEY ============
        function loadApiKey() {
            const saved = localStorage.getItem('jarvis_gemini_key');
            if (saved) {
                apiKeyInput.value = saved;
                // Validar formato
                if (saved.startsWith('AIzaSy')) {
                    apiSetup.classList.add('hidden');
                    btnStart.classList.remove('hidden');
                    return saved;
                } else {
                    // Clave inválida
                    addMessage('error',
                        '⚠️ La API Key guardada no es válida. Debe empezar con AIzaSy... Consiga una en aistudio.google.com/apikey');
                    apiSetup.classList.remove('hidden');
                    btnStart.classList.add('hidden');
                    return null;
                }
            }
            return null;
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showAlert('⚠️ Pegue su API Key primero');
                return;
            }
            if (!key.startsWith('AIzaSy')) {
                showAlert('❌ API Key inválida. Debe empezar con AIzaSy...');
                addMessage('error',
                    '❌ Tu clave AQ.Ab8... no funciona con Gemini. Necesitas una que empiece con AIzaSy... Consíguela en: aistudio.google.com/apikey');
                return;
            }

            localStorage.setItem('jarvis_gemini_key', key);
            apiSetup.classList.add('hidden');
            btnStart.classList.remove('hidden');
            addMessage('jarvis',
                '✅ ¡API Key correcta guardada! Ahora sí, soy inteligente de verdad. Inicie la escucha con el botón.');
            jarvisSpeak(
                'API Key guardada correctamente. Esta sí es válida, jefe. Ahora puedo responder cualquier pregunta. Inicie la escucha cuando guste.');
        }

        // ============ CHAT ============
        function addMessage(type, text) {
            const msg = document.createElement('div');
            msg.className = `chat-message ${type}`;
            msg.innerHTML = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============ GEMINI API (Versión adaptada) ============
        async function askGemini(question) {
            const apiKey = localStorage.getItem('jarvis_gemini_key');
            if (!apiKey || !apiKey.startsWith('AIzaSy')) return null;

            // Probar diferentes modelos
            for (const model of GEMINI_MODELS) {
                try {
                    const url =
                        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
                    const response = await fetch(`${url}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `Eres J.A.R.V.I.S., un asistente virtual mexicano. Hablas como mexicano amigable, usando expresiones como "jefe", "patrón", "qué onda", "ándele". Eres servicial, ingenioso y con humor mexicano. Responde de manera útil. La pregunta es: ${question}`
                                }]
                            }],
                            generationConfig: {
                                temperature: 0.8,
                                maxOutputTokens: 500,
                            }
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                            console.log(`✅ Modelo ${model} funcionó`);
                            return data.candidates[0].content.parts[0].text;
                        }
                    } else if (response.status === 403) {
                        console.log(`⚠️ Modelo ${model}: Acceso denegado`);
                        continue;
                    } else if (response.status === 404) {
                        console.log(`⚠️ Modelo ${model}: No encontrado`);
                        continue;
                    }
                } catch (e) {
                    console.log(`⚠️ Error con modelo ${model}:`, e.message);
                    continue;
                }
            }

            return null;
        }

        // ============ PROCESAR COMANDOS ============
        async function processCommand(command) {
            if (isProcessing || !command || command.length < 2) return;
            isProcessing = true;
            resetAwakeTimer();

            addMessage('user', command);
            console.log('📝 Comando:', command);

            let response = '';
            let action = null;

            // Comandos especiales
            if (command.includes('duerme') || command.includes('descansa')) {
                response = 'Entendido, jefe. Entrando en modo espera. Diga "Hola Jarvis" cuando me necesite.';
                addMessage('jarvis', response);
                await jarvisSpeak(response);
                goToSleep();
                isProcessing = false;
                return;
            }

            if (command.includes('youtube')) {
                response = 'Abriendo YouTube, jefe.';
                action = () => window.open('https://www.youtube.com', '_blank');
            } else if (command.includes('google') && !command.includes('busca')) {
                response = 'Abriendo Google.';
                action = () => window.open('https://www.google.com', '_blank');
            } else if (command.includes('busca') || command.includes('buscar')) {
                const query = command.replace(/busca|buscar|google|en google/g, '').trim();
                if (query && query.length > 2) {
                    response = `Buscando "${query}" en Google...`;
                    action = () => window.open(
                        `https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                } else {
                    response = '¿Qué quiere que busque, jefe?';
                }
            } else {
                // Buscar en base de conocimiento local
                const localAnswer = findAnswer(command);
                if (localAnswer) {
                    response = localAnswer;
                } else {
                    // Intentar con Gemini
                    const apiKey = localStorage.getItem('jarvis_gemini_key');

                    if (apiKey && apiKey.startsWith('AIzaSy')) {
                        jarvisCore.className = 'jarvis-core thinking';
                        statusDiv.textContent = 'PENSANDO...';
                        statusDiv.className = 'status status-thinking';

                        const thinkingMsg = document.createElement('div');
                        thinkingMsg.className = 'chat-message jarvis';
                        thinkingMsg.textContent = '💭 Consultando a Gemini...';
                        thinkingMsg.id = 'thinkingMsg';
                        chatContainer.appendChild(thinkingMsg);
                        chatContainer.scrollTop = chatContainer.scrollHeight;

                        const aiResponse = await askGemini(command);

                        const thinkEl = document.getElementById('thinkingMsg');
                        if (thinkEl) thinkEl.remove();

                        if (aiResponse) {
                            response = aiResponse;
                        } else {
                            response =
                                'Lo siento, jefe. No pude conectar con Gemini. Puede que su API Key no tenga acceso a los modelos. Verifique en Google Cloud Console que la API "Generative Language API" esté activada.';
                            addMessage('error', '⚠️ Error: La API Key puede no tener Generative Language API habilitada.');
                        }
                    } else if (apiKey && !apiKey.startsWith('AIzaSy')) {
                        response =
                            'Su API Key actual (AQ.Ab8...) no es compatible con Gemini. Necesita una que empiece con AIzaSy... Consígala en aistudio.google.com/apikey';
                        apiSetup.classList.remove('hidden');
                        btnStart.classList.add('hidden');
                    } else {
                        response =
                            'No tengo API Key configurada. Para respuestas inteligentes, configure una API Key de Gemini. Mientras tanto, pregúnteme: hora, fecha, chistes, o use "busca en Google".';
                    }
                }
            }

            addMessage('jarvis', response);
            if (action) setTimeout(action, 1500);
            await jarvisSpeak(response);
            isProcessing = false;
        }

        // ============ ESTADOS ============
        async function wakeUpJarvis() {
            if (isAwake || isProcessing) return;
            isAwake = true;
            isProcessing = true;

            jarvisCore.className = 'jarvis-core listening';
            statusDiv.textContent = 'DESPERTANDO...';
            statusDiv.className = 'status status-active';

            const hour = new Date().getHours();
            let greeting = 'Buenas noches';
            if (hour >= 6 && hour < 12) greeting = 'Buenos días';
            else if (hour >= 12 && hour < 18) greeting = 'Buenas tardes';

            const hasKey = localStorage.getItem('jarvis_gemini_key');
            const isValidKey = hasKey && hasKey.startsWith('AIzaSy');

            const phrase = isValidKey ?
                `${greeting}, jefe. Soy Jarvis con inteligencia artificial de Gemini. ¿En qué puedo ayudarle hoy?` :
                `${greeting}, jefe. Soy Jarvis. Para activar mi inteligencia total, configure una API Key de Gemini válida (AIzaSy...). La que tiene (AQ.Ab8...) no funciona.`;

            addMessage('jarvis', phrase);
            await jarvisSpeak(phrase);
            isProcessing = false;
            resetAwakeTimer();
        }

        let awakeTimer;

        function resetAwakeTimer() {
            clearTimeout(awakeTimer);
            awakeTimer = setTimeout(() => {
                if (isAwake && !isProcessing) goToSleep();
            }, 60000);
        }

        async function goToSleep() {
            isAwake = false;
            jarvisCore.className = 'jarvis-core';
            statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
            statusDiv.className = 'status';
            addMessage('jarvis', '😴 Modo espera. Diga "Hola Jarvis" para despertarme.');
        }

        // ============ RECONOCIMIENTO DE VOZ ============
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                addMessage('jarvis', '⚠️ Use Chrome para reconocimiento de voz.');
                return null;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-MX';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const last = event.results[event.results.length - 1];
                if (last?.[0]) {
                    const command = last[0].transcript.toLowerCase().trim();
                    console.log('🎤 Detectado:', command);

                    if (!isAwake && !isProcessing &&
                        (command.includes('hola jarvis') || command.includes('oye jarvis'))) {
                        wakeUpJarvis();
                    } else if (isAwake && !isProcessing && command.length > 2) {
                        processCommand(command);
                    }
                }
            };

            recognition.onerror = function(event) {
                console.error('Error:', event.error);
                setTimeout(() => {
                    try { if (recognition) recognition.start(); } catch (e) {}
                }, 1000);
            };

            recognition.onend = function() {
                if (!isProcessing) {
                    setTimeout(() => {
                        try { if (recognition) recognition.start(); } catch (e) {}
                    }, 300);
                }
            };

            return recognition;
        }

        async function startListening() {
            btnStart.style.display = 'none';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                alert('❌ Necesito permiso al micrófono.');
                btnStart.style.display = 'inline-block';
                return;
            }

            recognition = initSpeechRecognition();
            if (recognition) {
                try {
                    recognition.start();
                    statusDiv.textContent = 'J.A.R.V.I.S. EN LÍNEA';
                    addMessage('jarvis', '✅ Listo. Di "Hola Jarvis" para activarme...');
                } catch (e) {
                    btnStart.style.display = 'inline-block';
                }
            }
        }

        function speakCommand(text) {
            if (!isAwake) {
                wakeUpJarvis().then(() => {
                    setTimeout(() => processCommand(text.toLowerCase()), 2000);
                });
            } else {
                processCommand(text.toLowerCase());
            }
        }

        function showAlert(msg) {
            const alert = document.createElement('div');
            alert.className = 'alert';
            alert.textContent = msg;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = Math.random() * 10 + 5 + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                container.appendChild(p);
            }
        }

        window.onload = function() {
            createParticles();
            setupJarvisVoice();
            synth.onvoiceschanged = setupJarvisVoice;

            const savedKey = loadApiKey();
            if (!savedKey) {
                apiSetup.classList.remove('hidden');
                btnStart.classList.add('hidden');
                addMessage('error',
                    '⚠️ <strong>IMPORTANTE:</strong> Tu clave AQ.Ab8... no funciona con Gemini. Necesitas una API Key que empiece con <strong>AIzaSy...</strong><br><br>👉 Consíguela aquí: <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#00d4ff;">aistudio.google.com/apikey</a>');
            }

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && recognition && !isProcessing) {
                    try { recognition.start(); } catch (e) {}
                }
            });

            console.log('🤖 J.A.R.V.I.S. listo');
            console.log('⚠️ Se necesita API Key que empiece con AIzaSy...');
        };
    </script>
</body>
</html>
